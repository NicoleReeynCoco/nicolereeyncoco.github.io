  <body class="light hidden">
    <div class="stardust" id="stardustDark" aria-hidden="true"></div>
    <div class="w-full max-w-md glow-ring">
      <div class="citlali-card rounded-2xl p-6 space-y-6">
        <div class="text-center space-y-1 mt-4">
          <h1 class="text-3xl font-bold tracking-wide shimmer-text"> Opalstar Cipher </h1>
          <p class="text-sm text-main-subtitle tracking-wider font-light">
            <span class="text-cyan-400/90">✦</span> Scroll Weaver of Mictlan <span class="text-cyan-400/90">✦</span>
          </p>
          <!--p class="text-[0.6rem] uppercase tracking-[0.2em] text-slate-200 mt-0.5 text-slate-500/60">
                    client-side · star-forged
                </p-->
        </div>
        <div class="flex rounded-xl tab-container p-1">
          <button id="tabEncrypt" onclick="setMode('encrypt')" class="tab-btn active flex-1 py-2.5 text-sm font-semibold rounded-lg transition"> Itztli: Encrypt </button>
          <button id="tabDecrypt" onclick="setMode('decrypt')" class="tab-btn flex-1 py-2.5 text-sm font-semibold rounded-lg transition"> Itztli: Decrypt </button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="label-glow text-xs uppercase tracking-wider mb-1.5 block"> Obsidian Key </label>
            <div class="relative"><input type="password" id="keyInput" placeholder="16 --> 32 bytes · recommended" class="citlali-input w-full rounded-xl px-4 py-2.5 pr-12 text-sm placeholder:italic" />
              <button type="button" onclick="togglePasswordVisibility()" class="toggle-password-btn absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none flex items-center justify-center w-6 h-6">

              </button>
            </div>
          </div>
          <div>
            <label id="fileLabel" class="label-glow text-xs uppercase tracking-wider mb-1.5 block"> Dreams to Preserve </label>
            <div class="citlali-input w-full rounded-xl px-2 py-2 text-sm flex items-center gap-3 file-wrapper">
              <label for="fileInput" tabindex="0" class="file-select-btn px-4 py-1.5 rounded-lg text-xs cursor-pointer shrink-0 transition-colors"> Select spirits </label>
              <span id="fileChosenText" class="file-chosen-text truncate">No spirits selected</span>
            </div>
            <input type="file" id="fileInput" multiple class="hidden" />
          </div>
          <button onclick="processFiles()" id="actionBtn" class="btn-primary w-full text-base tracking-wide"> Citlalin, Itzpapa, get 'em! </button>
        </div>
        <div id="statusBox" class="hidden !border-none rounded-xl px-4 py-3 text-sm text-center"></div>
        <div class="text-center footer-text text-[0.60rem] uppercase tracking-[0.15em] pt-1 select-none">
          <span class="text-[0.60rem] footer-text-diamond">◇</span> starlight reflection <span class="text-[0.60rem] footer-text-diamond">◇</span>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        document.body.classList.remove('hidden')
        if (!window.location.hash) {
          history.replaceState(null, null, '#');
        }
      });
    </script>
    <script src="/crypt/ui_logic.js"></script>
    <script src="/crypt/encryption_logic.js"></script>
  </body>
  </html>
