<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Side File Integrity Checker</title>
    <script src="/hash/spark-md5.js"></script>
    <script src="/hash/xxhash.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" sizes="auto" href="../Purple_Butterfly_Icon.png">
</head>
<body class="bg-white dark:bg-[#121212] min-h-screen flex flex-col items-start justify-start sm:items-center sm:justify-center p-6 pt-12 sm:pt-6 transition-colors duration-200">

    <div class="w-full max-w-2xl">
        
        <h1 class="text-xl sm:text-2xl font-bold text-center text-gray-800 dark:text-gray-100 mb-8">Client-Side File Hashing</h1>
        
        <div class="mb-8">
            <input type="file" id="fileInput" class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 dark:file:bg-blue-950 file:text-blue-700 dark:file:text-blue-300 hover:file:bg-blue-100 dark:hover:file:bg-blue-900 cursor-pointer" />
        </div>
        
        <div id="results" class="space-y-4 text-xs sm:text-sm font-mono">
            <p class="text-sm"><strong class="text-[#88dbdc]">MD5:</strong> <span class="hover:underline text-gray-700 dark:text-gray-300 break-all" id="md5Result">Waiting for file...</span></p>
            <p class="text-sm"><strong class="text-[#e79d6c]">xxHash S-45893:</strong> <span class="hover:underline text-gray-700 dark:text-gray-300 break-all" id="xxhashResult">Waiting for file...</span></p>
            <p class="text-sm"><strong class="text-[#54b0f0]">xxHash S-0:</strong> <span class="hover:underline text-gray-700 dark:text-gray-300 break-all" id="xxhashResultSeed0">Waiting for file...</span></p>
            <p class="text-sm"><strong class="text-[#b5dd47]">xxHash S-1:</strong> <span class="hover:underline text-gray-700 dark:text-gray-300 break-all" id="xxhashResultSeed1">Waiting for file...</span></p>
        </div>

    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('md5Result').innerText = "Calculating...";
            document.getElementById('xxhashResult').innerText = "Calculating...";
            document.getElementById('xxhashResultSeed0').innerText = "Calculating...";
            document.getElementById('xxhashResultSeed1').innerText = "Calculating...";

            try {
                const arrayBuffer = await file.arrayBuffer();

                const md5Hash = SparkMD5.ArrayBuffer.hash(arrayBuffer);
                document.getElementById('md5Result').innerText = md5Hash;

                const seed = 0xabcd;
                const xxhashVal = XXH.h64(arrayBuffer, seed).toString(16);
                
                const hs0 = XXH.h64(arrayBuffer, 0).toString(16);
                const hs1 = XXH.h64(arrayBuffer, 1).toString(16);
                
                document.getElementById('xxhashResult').innerText = xxhashVal;
                document.getElementById('xxhashResultSeed0').innerText = hs0;
                document.getElementById('xxhashResultSeed1').innerText = hs1;
                
            } catch (error) {
                console.error("Error hashing file:", error);
                document.getElementById('md5Result').innerText = "Error";
                document.getElementById('xxhashResult').innerText = "Error";
                document.getElementById('xxhashResultSeed0').innerText = "Error";
                document.getElementById('xxhashResultSeed1').innerText = "Error";
                alert("An error occurred while reading the file. Check console for details.");
            }
        });
    </script>

</body>
</html>
